<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pergunte aos seus dados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E14;
    --panel:#10151F;
    --panel-alt:#151B27;
    --border:#1E2735;
    --text:#E7ECF3;
    --muted:#8892A6;
    --accent:#35D6B0;
    --accent-soft:rgba(53,214,176,.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
  }
  .wrap{max-width:900px;margin:0 auto;padding:48px 24px 80px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    color:var(--accent);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-bottom:14px;
    display:flex;align-items:center;gap:8px;
  }
  .eyebrow::before{
    content:'';width:7px;height:7px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 8px var(--accent);
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(26px,4vw,38px);
    margin:0 0 10px;
  }
  .sub{color:var(--muted);font-size:15px;max-width:560px;line-height:1.55;margin:0 0 32px;}

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
  }

  textarea{
    width:100%;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    resize:none;
    outline:none;
  }
  textarea:focus{border-color:var(--accent);}

  button{
    margin-top:14px;
    background:var(--accent);
    color:#04140F;
    border:none;
    border-radius:10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14.5px;
    padding:12px 18px;
    cursor:pointer;
  }
  button:hover{filter:brightness(1.08);}

  h3{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin:0 0 12px;
  }

  pre{
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    color:var(--accent);
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    white-space:pre-wrap;
    word-break:break-word;
    margin:0;
  }

  canvas{max-width:100%;}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;}
  th{
    text-align:left;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    color:var(--muted);
    padding:8px 10px;
    border-bottom:1px solid var(--border);
  }
  td{
    padding:8px 10px;
    border-bottom:1px solid var(--border);
  }
  tr:hover td{background:var(--panel-alt);}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Protótipo · IA + SQL, 100% no navegador</div>
  <h1>Pergunte aos seus dados</h1>
  <p class="sub">Digite uma pergunta em português sobre vendas e margem de contribuição. O Claude traduz para SQL, roda direto no navegador, e devolve gráfico + tabela.</p>

  <div class="panel">
    <textarea id="question" rows="3" placeholder="ex: qual canal teve a maior margem em março?"></textarea>
    <br>
    <button id="askBtn">Perguntar ao Claude →</button>
  </div>

  <div class="panel">
    <h3>SQL gerado</h3>
    <pre id="sqlOutput">(ainda nada)</pre>
  </div>

  <div class="panel">
    <h3>Gráfico</h3>
    <canvas id="chart" width="500" height="300"></canvas>
  </div>

  <div class="panel">
    <h3>Resultado</h3>
    <div id="resultArea">(ainda nada)</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script src="app.js"></script>
</div>
</body>
</html>
